[project]
name = "classic-flow"
version = "0.1.0"
description = "Runnable E2B scenarios for the three mainstream sandbox shapes."
requires-python = ">=3.11"
dependencies = [
    "e2b>=2.52.0",
    "e2b-code-interpreter>=2.3.0",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-q"
